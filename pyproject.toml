[tool.poetry]
package-mode = false

[project]
name = "ecommerce-homework"
version = "0.1.0"
description = "E-commerce core: Product and Category classes (SkyPro homework)"
authors = [
    { name = "Student", email = "student@example.com" }
]
readme = "README.md"
requires-python = ">=3.11"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=25.9.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
]

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
line_length = 119
profile = "black"
skip = [".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html --cov-report=json:coverage.json"

[tool.coverage.run]
source = ["src"]
omit = ["src/utils/__init__.py", "src/__init__.py"]

[tool.coverage.report]
fail_under = 75
show_missing = true
